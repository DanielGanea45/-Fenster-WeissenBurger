[build]
  publish = "."
  # Tests müssen bestehen, sonst wird nichts veröffentlicht; danach Konfigurator-Seiten gemäß data/einstellungen.json
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  included_files = ["data/*.json", "js/preis.js", "js/steuer.js", "js/preis-validate.js", "admin/index.html", "konfigurator/**/*.html"]

# Admin-Bereich: wird von einer Function ausgeliefert (auf Produktion ohne ADMIN_SETUP_TOKEN → 404)
[[redirects]]
  from = "/admin/*"
  to = "/.netlify/functions/admin-seite"
  status = 200
  force = true

# Sitemap-Index ersetzt die alte sitemap.xml
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301

# 301-Weiterleitungen von der bisherigen WordPress-Seite
[[redirects]]
  from = "/aluplast/"
  to = "/produkte/#aluplast"
  status = 301
[[redirects]]
  from = "/aluplast"
  to = "/produkte/#aluplast"
  status = 301
[[redirects]]
