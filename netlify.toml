[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    # SAMEORIGIN / frame-ancestors 'self': die Seiten dürfen nur von der eigenen Domain eingebettet werden –
    # der Admin zeigt sie im Texte-Editor als Live-Vorschau; fremde Seiten können sie weiterhin nicht einbetten.
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Die Content-Security-Policy steht NICHT hier, sondern in der vom Build erzeugten Datei _headers (scripts/headers.js):
    # streng ohne Chat; mit Live-Chat (Crisp) kommen dessen Domänen dazu. Beide Quellen zugleich würden sich gegenseitig
    # einschränken (zwei CSP-Kopfzeilen gelten gemeinsam).

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS/JS: jede Referenz trägt einen Inhalts-Hash (?v=…, scripts/assets-version.js, im Build geprüft) → ein Jahr
# unveränderlich cachen; nach einem Deploy ändert sich die URL, nie der Inhalt hinter einer URL.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML: kurz, immer beim Server nachfragen (ETag/304)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
